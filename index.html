<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家計アナライザ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1 column app. Upload strip on top, then period picker, KPIs, monthly trend, category + weekday, insights, big spends. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#14181f; --ink2:#4a525f; --muted:#7b8494; --line:#e2e5ea; --wash:#eef0f4;
  --inc:#2a78d6; --exp:#eb6834; --exp-ink:#b4441a;
  --good:#00703c; --warn:#9a6700; --crit:#c4262e;
  --good-bg:#e4f3ea; --warn-bg:#fbf0d3; --crit-bg:#fbe6e6; --info-bg:#e8eefa;
  --btn:#14181f; --btn-ink:#ffffff;
  --serif:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#181c23; --ink:#eceef2; --ink2:#b7bdc8; --muted:#8a92a1; --line:#2a303a; --wash:#1f242d;
  --inc:#3987e5; --exp:#d95926; --exp-ink:#f08a5d;
  --good:#5fcf94; --warn:#e8b94a; --crit:#ff8a8f;
  --good-bg:#12301f; --warn-bg:#352a0e; --crit-bg:#3a1618; --info-bg:#17243d;
  --btn:#eceef2; --btn-ink:#101318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#181c23; --ink:#eceef2; --ink2:#b7bdc8; --muted:#8a92a1; --line:#2a303a; --wash:#1f242d;
  --inc:#3987e5; --exp:#d95926; --exp-ink:#f08a5d;
  --good:#5fcf94; --warn:#e8b94a; --crit:#ff8a8f;
  --good-bg:#12301f; --warn-bg:#352a0e; --crit-bg:#3a1618; --info-bg:#17243d;
  --btn:#eceef2; --btn-ink:#101318; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--serif);margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.25}
h2{font-size:18px}
p{margin:0}
.lead{color:var(--ink2);max-width:62ch}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}

/* upload */
.up{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.drop{border:1.5px dashed var(--muted);border-radius:10px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--inc);background:var(--info-bg)}
.drop strong{font-size:16px}
.drop small{color:var(--muted)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--inc);outline-offset:2px}
.memo{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:92px;resize:vertical;font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button,select{font:inherit}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--inc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--info-bg);color:var(--ink)}
.pill.sample{background:var(--warn-bg);color:var(--warn)}
details.map{font-size:13px}
details.map summary{cursor:pointer;color:var(--ink2)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.mapgrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

/* period */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.bar label{display:flex;gap:8px;align-items:center;color:var(--ink2)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:12px;color:var(--muted);letter-spacing:.06em}
.kpi .v{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--ink2)}
.v.neg{color:var(--crit)}

/* charts */
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);margin:8px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.scroll{overflow-x:auto}
svg text{font-family:var(--sans);fill:var(--muted);font-size:11px}
.wrap>*,.up>*,.two>*{min-width:0}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.cats{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.cat{display:grid;grid-template-columns:minmax(72px,110px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat .t{height:12px;background:var(--wash);border-radius:3px;overflow:hidden}
.cat .t i{display:block;height:100%;background:var(--exp);border-radius:0 4px 4px 0}
.cat .n{overflow-wrap:anywhere}
.cat .a{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .a em{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.wk{display:flex;gap:8px;align-items:flex-end;height:150px;margin-top:14px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.wk i{display:block;width:100%;max-width:30px;background:var(--exp);border-radius:4px 4px 0 0;min-height:2px}
.wk b{font-weight:500;color:var(--ink2)}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.in{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;border-radius:8px;background:var(--wash)}
.tag{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;height:fit-content;white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.crit{background:var(--crit-bg);color:var(--crit)}
.tag.info{background:var(--info-bg);color:var(--ink)}
.in h3{margin:0;font-size:14.5px}
.in p{color:var(--ink2);font-size:14px}

table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 0}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12.5px;white-space:pre;max-width:260px}
.foot{font-size:12.5px;color:var(--muted)}
@media (max-width:720px){.up,.two{grid-template-columns:1fr}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.cat .t i,.wk i{transition:width .3s,height .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="eyebrow">PFIN ANALYZER</span>
    <h1>家計アナライザ</h1>
    <p class="lead">家計簿アプリの CSV や PDF を読み込むと、収支・カテゴリ・固定費・使いすぎの傾向をまとめます。データはこのブラウザの中だけで処理され、外には送られません。</p>
  </header>

  <section class="up" aria-label="データの取り込み">
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".csv,.tsv,.txt,.pdf,text/csv,text/plain,application/pdf">
      <strong>CSV / PDF をここにドロップ、またはクリックして選択</strong>
      <small>CSV（マネーフォワード ME / Zaim / 銀行・カード明細）と、iPhone の家計簿アプリ（MoneyNote など）で書き出した表形式の PDF に対応</small>
    </label>
    <div class="card memo">
      <label for="memo"><strong>メモから読み取る</strong></label>
      <textarea id="memo" placeholder="1行に1件ずつ&#10;10/3 ランチ 850&#10;10/5 スーパー 4,320&#10;10/25 給料 +280000"></textarea>
      <div class="row"><button class="btn" id="memoGo" type="button">メモを分析</button><button class="btn sub" id="sampleGo" type="button">サンプルで試す</button></div>
    </div>
  </section>

  <div class="status" id="status"></div>
  <details class="map" id="mapBox" hidden><summary>列の対応を確認・変更する</summary><div class="mapgrid" id="mapGrid"></div></details>

  <main id="out" class="wrap" style="gap:20px"></main>
  <p class="foot">分類が無い明細は、店名や内容のキーワードから推定します。振替・カード引き落とし・「計算対象外」の行は集計から除きます。</p>
</div>
<div id="tip" hidden></div>

    if(S.sel==='all'){cm=A.months[A.months.length-1]}
    var cur={},prev={};
    all.forEach(function(t){if(t.amt<0&&!t.saving){if(t.ym===cm)cur[t.cat]=(cur[t.cat]||0)-t.amt;if(t.ym===pmM)prev[t.cat]=(prev[t.cat]||0)-t.amt}});
    var ec=A.by[cm].exp,ep=A.by[pmM].exp;
    var ks={};Object.keys(cur).concat(Object.keys(prev)).forEach(function(k){ks[k]=1});
    var diffs=Object.keys(ks).map(function(k){return{n:k,d:(cur[k]||0)-(prev[k]||0)}});
    var up=diffs.filter(function(x){return x.d>0}).sort(function(a,b){return b.d-a.d}).slice(0,3);
    var dn=diffs.filter(function(x){return x.d<0}).sort(function(a,b){return a.d-b.d}).slice(0,1);
    var chg=ep>0?(ec-ep)/ep*100:0;
    var lastDay=Math.max.apply(null,all.filter(function(t){return t.ym===cm}).map(function(t){return t.d.getDate()}));
    var partial=cm===A.months[A.months.length-1]&&lastDay<20;
    var b='支出は '+yen(ep)+' から '+yen(ec)+' へ（'+(chg>=0?'+':'')+chg.toFixed(1)+'%）。';
    if(up.length)b+='増えたのは '+up.map(function(x){return x.n+' +'+yen(x.d)}).join('、')+'。';
    if(dn.length)b+='減ったのは '+dn[0].n+' '+yen(dn[0].d)+'。';
    if(partial)b+='最新月は途中までのデータです。';
    out.push({t:chg>15?'warn':chg<-5?'good':'info',l:'前月比',h:ymLabel(cm)+'は '+ymLabel(pmM)+' より'+(chg>=0?'増加':'減少'),b:b});
  }
  // fixed costs
  var allMonths=monthsOf(all),groups={};
  all.forEach(function(t){if(t.amt<0&&!t.saving){var k=norm(t.desc)||t.cat;(groups[k]=groups[k]||{n:t.desc,items:[],ms:{}});groups[k].items.push(-t.amt);groups[k].ms[t.ym]=1}});
  var need=allMonths.length>=4?3:2,flagged=all.some(function(t){return t.fixed&&t.amt<0&&!t.saving}),fixed;
  if(flagged){
    var fg={};all.forEach(function(t){if(t.fixed&&t.amt<0&&!t.saving){var k=norm(t.desc)||t.cat;(fg[k]=fg[k]||{n:t.desc,s:0});fg[k].s-=t.amt}});
    fixed=Object.keys(fg).map(function(k){return{n:fg[k].n,v:fg[k].s/allMonths.length}}).sort(function(a,b){return b.v-a.v});
  }else fixed=Object.keys(groups).map(function(k){return groups[k]}).filter(function(g){
    var mc=Object.keys(g.ms).length,mx=Math.max.apply(null,g.items),mn=Math.min.apply(null,g.items);
    return allMonths.length>=2&&mc>=need&&g.items.length<=mc*1.5&&mx<=mn*1.6;
  }).map(function(g){return{n:g.n,v:sum(g.items,function(x){return x})/Object.keys(g.ms).length}}).sort(function(a,b){return b.v-a.v});
  if(fixed.length){
    var tot=sum(fixed,function(x){return x.v}),avgE=sum(allMonths,function(m){return A.by[m].exp})/allMonths.length;
    out.push({t:'info',l:'固定費',h:'毎月かかっている支出が '+fixed.length+' 件あります',b:fixed.slice(0,5).map(function(x){return x.n+' '+yen(x.v)}).join('、')+(fixed.length>5?' ほか':'')+'。合計は月 '+yen(tot)+'で、月平均支出の '+Math.round(tot/avgE*100)+'% です。契約の見直し対象になります。'});
  }
  // small purchases
  var sm=A.exp.filter(function(t){return -t.amt<1000});
  if(sm.length>=8&&A.E>0){
    var sv=-sum(sm,function(t){return t.amt});
    out.push({t:sv/A.E>0.12?'warn':'info',l:'少額',h:'1,000円未満の支出が '+sm.length+' 回',b:'合計 '+yen(sv)+'（支出の '+Math.round(sv/A.E*100)+'%）、1回あたり平均 '+yen(sv/sm.length)+'。回数が多い店や用途がないか確認してみてください。'});
  }
  // big
  var big=A.exp.filter(function(t){return -t.amt>=30000});
  if(big.length&&A.E>0){
    var bv=-sum(big,function(t){return t.amt});
    out.push({t:bv/A.E>0.35?'warn':'info',l:'大口',h:'3万円以上の支出が '+big.length+' 件',b:'合計 '+yen(bv)+'で支出の '+Math.round(bv/A.E*100)+'%。単発の大きな買い物が月ごとの波を作っています。'});
  }
  if(A.E>0)out.push({t:'info',l:'日割り',h:'1日あたりの支出は '+yen(A.E/A.days),b:'期間 '+A.days+' 日で割った平均です。'+(A.I>0?'収入を日割りすると '+yen(A.I/A.days)+' です。':'')});
  return out;
}

/* ---------- render ---------- */
function barPath(x,y,w,h,r){
  if(h<=0)return '';r=Math.min(r,h,w/2);
  return 'M'+x+' '+(y+h)+'V'+(y+r)+'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'H'+(x+w-r)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'V'+(y+h)+'Z';
}
function monthChart(A){
  var n=A.months.length,slot=64,pl=44,pr=8,pt=12,pb=40,H=230,W=pl+pr+Math.max(n,3)*slot,ph=H-pt-pb;
  var mx=nice(Math.max.apply(null,A.months.map(function(m){return Math.max(A.by[m].inc,A.by[m].exp)}).concat([1])));
  var sy=function(v){return pt+ph-v/mx*ph};
  var g='';
  for(var i=0;i<=4;i++){var v=mx/4*i,y=sy(v);
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(Math.round(v))+'</text>';}
  A.months.forEach(function(m,i){
    var x0=pl+i*slot+(slot-52)/2,b=A.by[m],dim=S.sel!=='all'&&S.sel!==m;
    var tip=ymLabel(m)+'\n収入 '+yen(b.inc)+'\n支出 '+yen(b.exp)+'\n収支 '+yen(b.inc-b.exp);
    g+='<g opacity="'+(dim?.35:1)+'">'+
      '<path d="'+barPath(x0,sy(b.inc),24,ph+pt-sy(b.inc),4)+'" fill="var(--inc)"/>'+
      '<path d="'+barPath(x0+28,sy(b.exp),24,ph+pt-sy(b.exp),4)+'" fill="var(--exp)"/></g>'+
      '<text x="'+(x0+26)+'" y="'+(H-pb+16)+'" text-anchor="middle" style="fill:var(--ink2)">'+(+m.slice(5))+'月</text>'+
      ((i===0||m.slice(5)==='01')?'<text x="'+(x0+26)+'" y="'+(H-pb+30)+'" text-anchor="middle">'+m.slice(0,4)+'</text>':'')+
      '<rect x="'+(pl+i*slot)+'" y="'+pt+'" width="'+slot+'" height="'+(H-pt-pb+20)+'" fill="transparent" data-ym="'+m+'" data-tip="'+esc(tip)+'" style="cursor:pointer"/>';
  });
  return '<div class="scroll"><svg style="width:100%;min-width:'+W+'px;height:auto;display:block" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="月別の収入と支出">'+g+'</svg></div>';
}
function render(){
  var out=$('#out');
  if(!S.tx.length&&S.futureN){S.future=true;applyFuture()}
  if(!S.tx.length){out.innerHTML='<div class="card empty">取り込める明細がありませんでした。列の対応を確認してください。</div>';
    setStatus('日付と金額の列を読み取れませんでした。「列の対応」で指定してください。',true);return}
  var A=analyze(),I=S.info;
  $('#status').innerHTML=(S.sample?'<span class="pill sample">サンプルデータ</span>':'<span class="pill">'+esc((S.raw&&S.raw.label)||I.label||'')+'</span>')+
    '<span>'+I.n+' 件を集計</span>'+(I.excluded?'<span>・振替などを除外 '+I.excluded+' 件</span>':'')+(I.bad?'<span>・読み取れない行 '+I.bad+' 件</span>':'');
  var bal=A.I-A.E,rate=A.I>0?bal/A.I*100:null,nm=A.months.length;
  var pmTxt='';
  if(S.sel!=='all'&&A.pm){var p=A.by[A.pm];pmTxt='前月 '+yen(p.exp)}
  var kp=[
    ['収入',yen(A.I),S.sel==='all'?'月平均 '+yen(A.I/nm):(A.pm?'前月 '+yen(A.by[A.pm].inc):''),''],
    ['支出',yen(A.E),S.sel==='all'?'月平均 '+yen(A.E/nm):pmTxt,''],
    ['収支',yen(bal),(bal>=0?'黒字':'赤字')+(A.SV?'（貯蓄・投資 '+yen(A.SV)+' は支出に含めず）':''),bal<0?'neg':''],
    ['貯蓄率',rate===null?'—':rate.toFixed(1)+'%','目安は収入の20%','']
  ];
  var opts='<option value="all">全期間（'+nm+'か月）</option>'+A.months.map(function(m){return '<option value="'+m+'"'+(S.sel===m?' selected':'')+'>'+ymLabel(m)+'</option>'}).join('');
  var cl=A.catList,top=cl.slice(0,8),rest=cl.slice(8),restV=sum(rest,function(x){return x.v});
  if(restV>0)top.push({n:'その他 '+rest.length+'件',v:restV});
  var cm=Math.max.apply(null,top.map(function(c){return c.v}).concat([1]));
  var cats=top.map(function(c){return '<div class="cat"><span class="n">'+esc(c.n)+'</span><span class="t"><i style="width:'+(c.v/cm*100)+'%"></i></span><span class="a">'+yen(c.v)+'<em>'+Math.round(c.v/A.E*100)+'%</em></span></div>'}).join('');
  var wm=Math.max.apply(null,A.wk.concat([1])),WD=['日','月','火','水','木','金','土'];
  var wk=A.wk.map(function(v,i){return '<div data-tip="'+WD[i]+'曜 '+yen(v)+'"><span>'+short(Math.round(v))+'</span><i style="height:'+Math.max(2,v/wm*100)+'px"></i><b>'+WD[i]+'</b></div>'}).join('');
  var ins=insights(A).map(function(x){return '<div class="in"><span class="tag '+x.t+'">'+x.l+'</span><div><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div></div>'}).join('');
  var bigs=A.exp.slice().sort(function(a,b){return a.amt-b.amt}).slice(0,10).map(function(t){
    var d=t.d;return '<tr><td>'+(d.getMonth()+1)+'/'+d.getDate()+'</td><td>'+esc(t.desc)+'</td><td>'+esc(t.cat)+'</td><td class="r">'+yen(-t.amt)+'</td></tr>'}).join('');
  out.innerHTML=
   '<div class="card bar"><label for="period">分析する期間 <select id="period">'+opts+'</select></label><span class="foot">'+ymLabel(S.tx[0].ym)+'〜'+ymLabel(S.tx[S.tx.length-1].ym)+'のデータ</span>'+(S.futureN?'<label class="foot"><input type="checkbox" id="fut"'+(S.future?' checked':'')+'> 今日より先の予定 '+S.futureN+' 件も含める</label>':'')+'</div>'+
   '<div class="kpis">'+kp.map(function(k){return '<div class="card kpi"><span class="k">'+k[0]+'</span><span class="v '+k[3]+'">'+k[1]+'</span><span class="d">'+esc(k[2])+'</span></div>'}).join('')+'</div>'+
   '<section class="card"><h2>月ごとの収入と支出</h2><div class="legend"><span><i class="sw" style="background:var(--inc)"></i>収入</span><span><i class="sw" style="background:var(--exp)"></i>支出</span><span>棒をクリックすると、その月を分析します</span></div>'+monthChart(A)+'</section>'+
   '<div class="two"><section class="card"><h2>分類ごとの支出</h2>'+(cats||'<p class="empty">支出がありません。</p>')+'</section>'+
   '<section class="card"><h2>曜日ごとの支出</h2><p class="foot">期間内の合計です。</p><div class="wk">'+wk+'</div></section></div>'+
   '<section class="card"><h2>気づいたこと</h2><div class="ins">'+(ins||'<p class="empty">十分なデータがありません。</p>')+'</div></section>'+
   '<section class="card"><h2>大きな支出 上位10件</h2><div class="scroll"><table><thead><tr><th>日付</th><th>内容</th><th>分類</th><th class="r">金額</th></tr></thead><tbody>'+(bigs||'<tr><td colspan="4" class="empty">なし</td></tr>')+'</tbody></table></div></section>';
}

/* ---------- sample ---------- */
function sampleCSV(){
  var seed=7;function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
  var R=function(a,b){return Math.round((a+rnd()*(b-a))/10)*10};
  var rows=[['計算対象','日付','内容','金額（円）','保有金融機関','大項目','中項目','メモ','振替','ID']],id=1;
  function add(y,m,d,desc,amt,cat,sub){rows.push(['1',y+'/'+('0'+m).slice(-2)+'/'+('0'+d).slice(-2),desc,amt,'メイン口座',cat,sub||'','', '0',id++])}
  for(var m=5;m<=10;m++){var y=2026;
    add(y,m,25,'給与',282000+(m===7?0:0),'収入','給与');
    add(y,m,27,'家賃',-82000,'住宅','家賃');
    add(y,m,26,'東京電力',-R(5200,8200),'水道・光熱費','電気');
    add(y,m,26,'東京ガス',-R(2800,4800),'水道・光熱費','ガス');
    add(y,m,26,'水道局',-2840,'水道・光熱費','水道');
    add(y,m,20,'ドコモ',-7820,'通信費','携帯電話');
    add(y,m,5,'Netflix',-1490,'娯楽','動画配信');
    add(y,m,9,'Spotify',-980,'娯楽','音楽配信');
    for(var i=0;i<8;i++)add(y,m,2+i*3,'スーパーマルエツ',-R(1800,6800),'食費','食料品');
    for(var j=0;j<(m>=9?16:11);j++)add(y,m,1+((j*5)%28),j%3?'セブンイレブン':'ローソン',-R(180,780),'食費','コンビニ');
    for(var k=0;k<6;k++)add(y,m,3+k*5,k%2?'ランチ':'居酒屋',-R(900,5600),'食費','外食');
    add(y,m,4,'Suica チャージ',-3000,'交通費','電車');add(y,m,18,'Suica チャージ',-3000,'交通費','電車');
    add(y,m,12,'ドラッグストア',-R(1500,3800),'日用品','日用品');
    add(y,m,22,'ダイソー',-R(500,1500),'日用品','日用品');
    if(m%2===0)add(y,m,14,'クリニック',-R(1800,3800),'医療','病院');
    if(m===8)add(y,m,16,'ヤマダ電機 冷蔵庫',-98000,'日用品','家電');
    if(m===9)add(y,m,21,'旅行 ホテル・航空券',-62000,'旅行','旅行');
    if(m===10)add(y,m,11,'ユニクロ',-14800,'衣服・美容','衣服');
  }
  return rows.map(function(r){return r.map(function(c){return /[,"]/.test(c)?'"'+c+'"':c}).join(',')}).join('\n');
}

/* ---------- events ---------- */
var tip=$('#tip');
document.addEventListener('pointermove',function(e){
  var t=e.target.closest&&e.target.closest('[data-tip]');
  if(!t){tip.hidden=true;return}
  tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
  var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,h=tip.offsetHeight;
  if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
});
document.addEventListener('click',function(e){
  var r=e.target.closest&&e.target.closest('[data-ym]');
  if(r){S.sel=S.sel===r.getAttribute('data-ym')?'all':r.getAttribute('data-ym');render()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='period'){S.sel=e.target.value;render()}
  else if(e.target.id==='fut'){S.future=e.target.checked;applyFuture();render()}
  else if(e.target.dataset&&e.target.dataset.role){S.map[e.target.dataset.role]=+e.target.value;buildTx();render()}
});
$('#file').addEventListener('change',function(e){if(e.target.files[0])readFile(e.target.files[0]);e.target.value=''});
var drop=$('#drop');
['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){var f=e.dataTransfer.files[0];if(f)readFile(f)});
$('#memoGo').addEventListener('click',function(){loadMemo($('#memo').value)});
$('#sampleGo').addEventListener('click',function(){loadCSVText(sampleCSV(),'サンプル',true)});

loadCSVText(sampleCSV(),'サンプル',true);
})();
</script>
